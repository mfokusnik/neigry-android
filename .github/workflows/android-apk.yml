name: Build NEIGRY Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "assets/**"
      - "test/**"
      - "tool/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "VERSION"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: neigry-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FLUTTER_VERSION: "3.44.9"
      API_BASE_URL: "https://nogames.mycarolina.ru"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Dart and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: neigry-android-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            neigry-android-${{ runner.os }}-

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare Flutter Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter precache --android
          flutter --version
          flutter doctor -v

      - name: Install Android API 36 platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          "$sdkmanager_bin" "platforms;android-36"

      - name: Generate Android platform if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -d android ]; then
            echo "android/ already exists; keeping repository version."
            exit 0
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          flutter create \
            --platforms=android \
            --org ru.mycarolina \
            --project-name neigry \
            "$tmp/neigry"

          cp -a "$tmp/neigry/android" ./android

      - name: Configure Android phone and TV target
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/configure_android.py

      - name: Configure stable signing when secrets exist
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_UPLOAD_KEYSTORE_B64:-}" ]; then
            echo "::warning::Stable signing secrets are not configured. APK will use Flutter's temporary debug signing and may require uninstalling the previous test build before an update."
            exit 0
          fi

          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing signing secret $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/neigry-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          keytool -list \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$keystore
          PROPS

          python3 tool/configure_signing.py

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          release = Path('VERSION').read_text(encoding='utf-8').strip()
          parts = [int(v) for v in release.split('.')]
          if len(parts) != 3:
              raise SystemExit(f'VERSION must be major.minor.patch, got: {release}')
          major, minor, patch = parts
          build_number = major * 1_000_000 + minor * 10_000 + patch * 100
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'APP_RELEASE_VERSION={release}\n')
              handle.write(f'ANDROID_BUILD_NUMBER={build_number}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'version={release}\n')
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="$APP_RELEASE_VERSION" \
            --build-number="$ANDROID_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "NEIGRY-${APP_RELEASE_VERSION}.apk"
          sha256sum "NEIGRY-${APP_RELEASE_VERSION}.apk" > "NEIGRY-${APP_RELEASE_VERSION}.apk.sha256"
          ls -lh "NEIGRY-${APP_RELEASE_VERSION}.apk" "NEIGRY-${APP_RELEASE_VERSION}.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEIGRY-Android-${{ steps.version.outputs.version }}
          path: |
            NEIGRY-*.apk
            NEIGRY-*.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
