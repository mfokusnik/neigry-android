name: Bootstrap NEIGRY Android repository

on:
  push:
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore audited v0.2.0 project
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/project.part*.b64 | base64 --decode > /tmp/neigry-project.zip
          echo "3883156f4465479fed5e06ae4bcb65341e0bfb887b410b2973f8527fcba31b81  /tmp/neigry-project.zip" | sha256sum -c -
          unzip -o /tmp/neigry-project.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit clean project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Import audited NEIGRY Android v0.2.0"
          git push origin HEAD:main
